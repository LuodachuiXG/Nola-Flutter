name: nola
description: "Nola 博客管理端 Flutter 客户端。"
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^3.0.0
  # 路由
  go_router: ^16.0.0
  # 网络请求
  dio: ^5.8.0
  # 本地持久化（Token / 服务器地址等）
  shared_preferences: ^2.5.0
  # 日期格式化
  intl: ^0.20.0
  # 文件选择（上传文件、导入备份等）
  file_picker: ^10.2.0
  # 分享导出的备份文件
  share_plus: ^12.0.0
  # Markdown 预览（WebView 渲染）
  webview_flutter: ^4.13.0
  window_manager: 0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 应用图标生成
  flutter_launcher_icons: ^0.14.4
  # 图标资产处理（生成自适应图标前景）
  image: ^4.5.0

# 应用图标生成配置（dart run flutter_launcher_icons）
flutter_launcher_icons:
  image_path: "assets/nola_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/nola_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#306FFF"
  windows:
    generate: true
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/nola_logo.png
    - assets/nola_icon.png
    - assets/nola_icon_foreground.png
    - assets/markdown/

  # 全局默认字体（小米 MiSans，Free for commercial use）
  # 仅打包实际用到的字重以控制包体积：w400/w500/w700，
  # w600 由引擎就近选择 Bold 覆盖，其余字重不打包。
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Bold.ttf
          weight: 700
